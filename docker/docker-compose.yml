services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: diagnostic_api
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - NEO4J_DATABASE=neo4j
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5:latest
      - EMBEDDING_PROVIDER=ollama
      - EMBEDDING_MODEL=mxbai-embed-large:latest
      - VECTOR_INDEX_DIM=1024
      - MOCK_LLM=false
      - ZAMMAD_URL=http://zammad:3000
      - ZAMMAD_TOKEN=${ZAMMAD_TOKEN:-}
      - ZAMMAD_DEFAULT_GROUP=Users
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - SMTP_FROM=diagnostic-agent@ccu.local
      - REPORT_RECIPIENTS=${REPORT_RECIPIENTS:-noc@ccu.local,support@ccu.local}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      - neo4j
      - zammad
      - mailhog
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  neo4j:
    image: neo4j:5
    container_name: diagnostic_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_dbms_memory_heap_max__size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  zammad-postgres:
    image: postgres:15-alpine
    container_name: diagnostic_zammad_postgres
    environment:
      - POSTGRES_USER=zammad
      - POSTGRES_PASSWORD=zammad
      - POSTGRES_DB=zammad
    volumes:
      - zammad_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zammad -d zammad"]
      interval: 10s
      timeout: 5s
      retries: 5

  zammad:
    image: zammad/zammad:6
    container_name: diagnostic_zammad
    ports:
      - "3000:3000"
    environment:
      - ZAMMAD_DB_ADAPTER=postgresql
      - ZAMMAD_DB_HOST=zammad-postgres
      - ZAMMAD_DB_PORT=5432
      - ZAMMAD_DB_USER=zammad
      - ZAMMAD_DB_PASSWORD=zammad
      - ZAMMAD_DB_NAME=zammad
      - ZAMMAD_RAILS_TRUSTED_PROXIES=0.0.0.0/0
    depends_on:
      zammad-postgres:
        condition: service_healthy
    volumes:
      - zammad_data:/opt/zammad
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  mailhog:
    image: mailhog/mailhog:latest
    container_name: diagnostic_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  splunk:
    image: splunk/splunk:latest
    container_name: diagnostic_splunk
    ports:
      - "8088:8088"
      - "18000:8000"
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_PASSWORD=SplunkAdmin123!
    volumes:
      - splunk_data:/opt/splunk/var

  prism:
    image: stoplight/prism:4
    container_name: diagnostic_prism
    command: ["mock", "-h", "0.0.0.0", "/api.yml"]
    ports:
      - "4010:4010"
    volumes:
      - ../mocks:/api.yml:ro

volumes:
  neo4j_data:
  neo4j_logs:
  zammad_postgres_data:
  zammad_data:
  splunk_data:

# Ollama optionnel : décommenter pour exécuter Ollama dans Docker au lieu de l'hôte.
