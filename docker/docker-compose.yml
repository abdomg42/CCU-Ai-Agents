services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: diagnostic_api
    ports:
      - "8000:8000"
    environment:
      # Connexion à Neo4j local sur la machine hôte
      - NEO4J_URI=bolt://host.docker.internal:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - NEO4J_DATABASE=neo4j
      # Ollama local sur la machine hôte
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5:latest
      - EMBEDDING_PROVIDER=ollama
      - EMBEDDING_MODEL=mxbai-embed-large:latest
      - VECTOR_INDEX_DIM=1024
      - MOCK_LLM=false
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  # Ollama optionnel : décommenter pour exécuter Ollama dans Docker au lieu de l'hôte.
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama:/root/.ollama

