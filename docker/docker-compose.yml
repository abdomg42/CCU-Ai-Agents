services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: diagnostic_api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      # Overrides nécessaires car le conteneur ne peut pas utiliser localhost.
      - ZAMMAD_URL=http://host.docker.internal:8080
    volumes:
      - ../reports:/app/reports
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  # Zammad is not included here because the official Zammad stack requires
  # several services (railsserver, nginx, postgres, elasticsearch, redis).
  # See README.md for how to run Zammad separately.

  splunk:
    image: splunk/splunk:9.1.2
    platform: linux/amd64
    container_name: diagnostic_splunk
    user: "0:0"
    profiles:
      - full
    ports:
      - "8088:8088"
      - "8089:8089"
      - "18000:8000"
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_PASSWORD=SplunkAdmin123!
      - SPLUNK_USER=root
    volumes:
      - splunk_data:/opt/splunk/var

  prism:
    image: stoplight/prism:4
    platform: linux/amd64
    container_name: diagnostic_prism
    profiles:
      - full
    command: ["mock", "-h", "0.0.0.0", "/api.yml"]
    ports:
      - "4010:4010"
    volumes:
      - ../mocks:/api.yml:ro

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    platform: linux/amd64
    container_name: diagnostic_kafka
    profiles:
      - full
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

volumes:
  splunk_data:

