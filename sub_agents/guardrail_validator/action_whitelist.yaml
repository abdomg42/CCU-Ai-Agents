# Whitelist des actions autorisées à être proposées par le système.
# Toute action hors de cette liste est refusée par le guardrail.
# Le niveau de risque est attribué par le guardrail selon la catégorie.

whitelist:
  - action: "Envoyer un technicien sur site pour contrôle du point de terminaison optique (PTO)"
    category: "intervention terrain"
    risk: "Moyen"

  - action: "Relancer l'appel CRM et forcer le passage de la commande en 'inProgress' si le retry réussit"
    category: "retry system"
    risk: "Faible"

  - action: "Reprovisionner l'ICCID dans le HLR/HSS puis relancer l'activation SIM"
    category: "configuration core"
    risk: "Critique"

  - action: "Corriger le VLAN sur le port switch concerné"
    category: "configuration réseau"
    risk: "Moyen"

  - action: "Investigation complémentaire sur la cause identifiée"
    category: "investigation"
    risk: "Faible"

  - action: "Escalade vers l'équipe support pour investigation manuelle"
    category: "escalade"
    risk: "Faible"

  - action: "Redémarrer le service CCU provisioner"
    category: "restart"
    risk: "Moyen"

  - action: "Purger la file d'attente des commandes TMF622"
    category: "purge"
    risk: "Critique"
