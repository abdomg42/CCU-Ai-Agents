[project]
name = "diagnostic-technique"
version = "0.1.0"
description = "Agent IA de diagnostic technique CCU via LangGraph, FastAPI et Neo4j GraphRAG."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-ollama>=0.1.0",
    "neo4j>=5.0.0",
    "sentence-transformers>=3.0.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pytest>=8.2.0",
    "anthropic>=0.34.0",
    "datasets>=3.0.0",
    "jinja2>=3.1.4",
    "weasyprint>=62.3",
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.setuptools]
py-modules = []
